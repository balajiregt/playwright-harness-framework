name: capture-recipes
version: 1
generated_from: examples/sample-crm-app/source-manifest.json
purpose: Reusable role and flow capture workflows for playwright-cli page context.
usage:
  list: npm run capture:recipe -- --list
  run_manager: npm run capture:crm:manager
  dry_run: npm run capture:recipe -- crm-manager-role --dry-run
rules:
  - Capture workflows are stored as YAML recipes in this file.
  - Workflows capture page context once and reuse it for prompt-to-test generation.
  - Refresh only affected captures when routes, visible copy, locators, or role permissions change.
  - Do not treat captures as test verification; run npx playwright test after generating or healing tests.
recipes:
  crm-admin-role:
    description: Capture admin role accessible and denied states from the source manifest.
    app_url: http://127.0.0.1:4173
    login_route: /login
    auth:
      strategy: localStorage
      key: crm-user
      value:
        username: admin@example.com
        password: password
        role: admin
        displayName: Asha Admin
        routes:
          - /crm/dashboard
          - /crm/leads
          - /crm/accounts
          - /crm/opportunities
          - /crm/reports
          - /crm/admin/users
    captures:
      - name: crm-admin-dashboard-loaded
        route: /crm/dashboard
        role: admin
        expected_access: allowed
        state: loaded
        screenshot: true
      - name: crm-admin-leads-empty
        route: /crm/leads
        role: admin
        expected_access: allowed
        state: empty
        screenshot: false
      - name: crm-admin-accounts-loaded
        route: /crm/accounts
        role: admin
        expected_access: allowed
        state: loaded
        screenshot: false
      - name: crm-admin-opportunities-loaded
        route: /crm/opportunities
        role: admin
        expected_access: allowed
        state: loaded
        screenshot: false
      - name: crm-admin-reports-error
        route: /crm/reports
        role: admin
        expected_access: allowed
        state: error
        screenshot: false
      - name: crm-admin-admin-users-loaded
        route: /crm/admin/users
        role: admin
        expected_access: allowed
        state: loaded
        screenshot: false
