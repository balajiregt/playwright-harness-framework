<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Playwright Harness Core Architecture</title>
  <desc id="desc">Architecture map showing agent inputs, planning and intelligence, Playwright framework layers, and evidence loop.</desc>
  <defs>
    <pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="4" fill="#1f2937" opacity="0.75"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 11 6 1 11z" fill="#d6d9df"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/></filter>
    <style>
      .bg{fill:#020817}.title{fill:#f8fafc;font:700 44px Inter,Arial,sans-serif}.sub{fill:#b6c2d1;font:400 22px Inter,Arial,sans-serif}.frame{fill:none;stroke:#d6d9df;stroke-width:4;stroke-dasharray:18 16}.head{fill:#f8fafc;font:700 25px Inter,Arial,sans-serif}.box{stroke:#d6d9df;stroke-width:3;filter:url(#shadow);rx:8}.dark{fill:#20242b}.green{fill:#0f766e}.blue{fill:#0f83bd}.purple{fill:#5b3fb3}.orange{fill:#9a5412}.text{fill:#f8fafc;font:700 21px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#e5e7eb;font:500 16px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.edge{stroke:#d6d9df;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000"/><rect width="1600" height="1000" fill="url(#dots)" opacity="0.8"/>
  <text class="title" x="800" y="64" text-anchor="middle">Core Architecture</text>
  <text class="sub" x="800" y="103" text-anchor="middle">Prompt context flows into framework layers, then into evidence-based verification</text>

  <rect class="frame" x="70" y="155" width="330" height="720" rx="16"/><text class="head" x="110" y="195">Agent Inputs</text>
  <rect class="box dark" x="120" y="235" width="230" height="62"/><text class="text" x="235" y="266">Prompt</text>
  <rect class="box dark" x="120" y="325" width="230" height="62"/><text class="text" x="235" y="356">AGENTS.md</text>
  <rect class="box dark" x="120" y="415" width="230" height="62"/><text class="text" x="235" y="446">Copilot Rules</text>
  <rect class="box dark" x="120" y="505" width="230" height="62"/><text class="text" x="235" y="536">contexts/*.yml</text>
  <rect class="box blue" x="120" y="595" width="230" height="62"/><text class="text" x="235" y="626">captures</text>

  <rect class="frame" x="450" y="155" width="330" height="720" rx="16"/><text class="head" x="490" y="195">Planning</text>
  <rect class="box purple" x="500" y="235" width="230" height="62"/><text class="text" x="615" y="266">flow specs</text>
  <rect class="box green" x="500" y="325" width="230" height="62"/><text class="text" x="615" y="356">source graph</text>
  <rect class="box green" x="500" y="415" width="230" height="62"/><text class="text" x="615" y="446">test graph</text>
  <rect class="box orange" x="500" y="505" width="230" height="62"/><text class="text" x="615" y="536">coverage graph</text>
  <rect class="box orange" x="500" y="595" width="230" height="62"/><text class="text" x="615" y="626">duplicate rules</text>

  <rect class="frame" x="830" y="155" width="330" height="720" rx="16"/><text class="head" x="870" y="195">Framework</text>
  <rect class="box green" x="880" y="235" width="230" height="62"/><text class="text" x="995" y="266">fixtures</text>
  <rect class="box green" x="880" y="325" width="230" height="62"/><text class="text" x="995" y="356">pages</text>
  <rect class="box green" x="880" y="415" width="230" height="62"/><text class="text" x="995" y="446">assertions</text>
  <rect class="box green" x="880" y="505" width="230" height="62"/><text class="text" x="995" y="536">data</text>
  <rect class="box blue" x="880" y="595" width="230" height="62"/><text class="text" x="995" y="626">tests</text>

  <rect class="frame" x="1210" y="155" width="330" height="720" rx="16"/><text class="head" x="1250" y="195">Evidence Loop</text>
  <rect class="box blue" x="1260" y="235" width="230" height="62"/><text class="text" x="1375" y="266">playwright-cli</text>
  <rect class="box blue" x="1260" y="325" width="230" height="62"/><text class="text" x="1375" y="356">npx test</text>
  <rect class="box orange" x="1260" y="415" width="230" height="62"/><text class="text" x="1375" y="446">traces</text>
  <rect class="box orange" x="1260" y="505" width="230" height="62"/><text class="text" x="1375" y="536">reports</text>
  <rect class="box green" x="1260" y="595" width="230" height="62"/><text class="text" x="1375" y="626">review gates</text>

  <path class="edge" d="M350 536H490"/><path class="edge" d="M730 536H870"/><path class="edge" d="M1110 626H1250"/><path class="edge" d="M1375 657C1375 780 615 790 615 670"/>
</svg>
