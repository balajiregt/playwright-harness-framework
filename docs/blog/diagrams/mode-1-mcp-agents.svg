<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mode 1 With MCP And Official Playwright Agents</title>
  <desc id="desc">Architecture diagram showing prompt, harness context, official Playwright planner generator healer agents, MCP browser context, framework layers, Playwright test verification, evidence and CI review gates.</desc>
  <defs>
    <pattern id="dot-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="4.5" fill="#1f2937" opacity="0.72"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#d6d9df"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill: #020817; }
      .title { fill: #f8fafc; font: 700 44px Inter, Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #b6c2d1; font: 400 22px Inter, Arial, sans-serif; }
      .box { fill: #20242b; stroke: #d6d9df; stroke-width: 3; filter: url(#soft-shadow); }
      .box-blue { fill: #0f83bd; stroke: #cdeafe; stroke-width: 3; filter: url(#soft-shadow); }
      .box-green { fill: #0f766e; stroke: #ccfbf1; stroke-width: 3; filter: url(#soft-shadow); }
      .box-purple { fill: #5b3fb3; stroke: #ddd6fe; stroke-width: 3; filter: url(#soft-shadow); }
      .box-orange { fill: #9a5412; stroke: #fed7aa; stroke-width: 3; filter: url(#soft-shadow); }
      .dash { fill: none; stroke: #d6d9df; stroke-width: 4; stroke-dasharray: 18 16; }
      .label { fill: #f8fafc; font: 700 26px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .small { fill: #e5e7eb; font: 600 19px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .tiny { fill: #d1d5db; font: 500 17px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .edge { stroke: #d6d9df; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .edge-soft { stroke: #8fb9cf; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .chip { fill: #4b5563; stroke: #9ca3af; stroke-width: 2; }
      .chip-text { fill: #f3f4f6; font: 700 18px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <rect width="1600" height="1000" fill="url(#dot-grid)" opacity="0.75"/>

  <text class="title" x="800" y="70" text-anchor="middle">Mode 1: MCP + Official Playwright Agents</text>
  <text class="subtitle" x="800" y="108" text-anchor="middle">Fast exploration and generation, governed by the team harness</text>

  <rect class="dash" x="70" y="150" width="1460" height="770" rx="18"/>
  <text class="tiny" x="190" y="150">MCP-enabled enterprise path</text>

  <rect class="box" x="620" y="160" width="360" height="100" rx="8"/>
  <text class="label" x="800" y="210">Prompt / Flow Request</text>

  <rect class="box-green" x="115" y="305" width="350" height="170" rx="8"/>
  <text class="label" x="290" y="345">Harness Context</text>
  <text class="tiny" x="290" y="386">AGENTS.md, Copilot rules</text>
  <text class="tiny" x="290" y="416">contexts/*.yml</text>
  <text class="tiny" x="290" y="446">tags, fixtures, review gates</text>

  <rect class="box-purple" x="575" y="310" width="450" height="205" rx="8"/>
  <text class="label" x="800" y="350">Official Playwright Agents</text>
  <rect class="chip" x="620" y="390" width="110" height="48" rx="6"/>
  <text class="chip-text" x="675" y="414">Planner</text>
  <rect class="chip" x="745" y="390" width="130" height="48" rx="6"/>
  <text class="chip-text" x="810" y="414">Generator</text>
  <rect class="chip" x="890" y="390" width="100" height="48" rx="6"/>
  <text class="chip-text" x="940" y="414">Healer</text>
  <text class="tiny" x="800" y="475">creates plans, tests, and repairs</text>

  <rect class="box-blue" x="1135" y="305" width="350" height="170" rx="8"/>
  <text class="label" x="1310" y="345">MCP Browser Context</text>
  <text class="tiny" x="1310" y="386">live page tree</text>
  <text class="tiny" x="1310" y="416">actions and observations</text>
  <text class="tiny" x="1310" y="446">agent-assisted exploration</text>

  <rect class="box" x="150" y="630" width="430" height="175" rx="8"/>
  <text class="label" x="365" y="670">Framework Layers</text>
  <text class="tiny" x="365" y="712">specs, tests, fixtures</text>
  <text class="tiny" x="365" y="742">pages, assertions, data</text>
  <text class="tiny" x="365" y="772">stable locators and auth state</text>

  <rect class="box-blue" x="700" y="640" width="250" height="115" rx="8"/>
  <text class="label" x="825" y="685">npx playwright</text>
  <text class="small" x="825" y="722">test / grep / project</text>

  <rect class="box-orange" x="1070" y="630" width="350" height="175" rx="8"/>
  <text class="label" x="1245" y="670">Evidence</text>
  <text class="tiny" x="1245" y="712">terminal output</text>
  <text class="tiny" x="1245" y="742">traces, screenshots, reports</text>
  <text class="tiny" x="1245" y="772">healer feedback loop</text>

  <rect class="box-green" x="620" y="835" width="360" height="90" rx="8"/>
  <text class="label" x="800" y="880">Review Gates + CI</text>

  <path class="edge" d="M 800 260 L 800 300"/>
  <path class="edge" d="M 465 390 L 565 390"/>
  <path class="edge-soft" d="M 1135 390 L 1035 390"/>
  <path class="edge" d="M 800 515 C 800 570 365 565 365 620"/>
  <path class="edge" d="M 580 718 L 690 700"/>
  <path class="edge" d="M 950 700 L 1060 718"/>
  <path class="edge" d="M 1245 630 C 1245 560 945 555 940 445"/>
  <path class="edge" d="M 825 755 L 825 825"/>
</svg>
