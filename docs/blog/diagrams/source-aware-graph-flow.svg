<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Source Aware Graph Intelligence Flow</title>
  <desc id="desc">Flow diagram showing source manifest, existing tests, captures, graph scripts, graph report, possible tests, coverage gaps, duplicate candidates, and visual map.</desc>
  <defs>
    <pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="4" fill="#1f2937" opacity="0.75"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 11 6 1 11z" fill="#d6d9df"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/></filter>
    <style>
      .bg{fill:#020817}.title{fill:#f8fafc;font:700 44px Inter,Arial,sans-serif}.sub{fill:#b6c2d1;font:400 22px Inter,Arial,sans-serif}.box{stroke:#d6d9df;stroke-width:3;filter:url(#shadow)}.dark{fill:#20242b}.green{fill:#0f766e}.blue{fill:#0f83bd}.purple{fill:#5b3fb3}.orange{fill:#9a5412}.red{fill:#991b1b}.text{fill:#f8fafc;font:700 23px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#e5e7eb;font:500 17px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.edge{stroke:#d6d9df;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="900" fill="url(#dots)" opacity="0.8"/>
  <text class="title" x="800" y="64" text-anchor="middle">Source-Aware Graph Intelligence</text>
  <text class="sub" x="800" y="103" text-anchor="middle">Compare what can be tested with what is already covered</text>

  <rect class="box dark" x="95" y="210" width="300" height="105" rx="8"/><text class="text" x="245" y="250">App Source</text><text class="small" x="245" y="282">or source manifest</text>
  <rect class="box dark" x="95" y="395" width="300" height="105" rx="8"/><text class="text" x="245" y="435">Existing Tests</text><text class="small" x="245" y="467">specs, pages, assertions</text>
  <rect class="box dark" x="95" y="580" width="300" height="105" rx="8"/><text class="text" x="245" y="620">Curated Captures</text><text class="small" x="245" y="652">contexts/captures</text>

  <rect class="box green" x="525" y="210" width="270" height="90" rx="8"/><text class="text" x="660" y="255">graph:source</text>
  <rect class="box blue" x="525" y="445" width="270" height="90" rx="8"/><text class="text" x="660" y="490">graph:tests</text>
  <rect class="box orange" x="900" y="300" width="280" height="90" rx="8"/><text class="text" x="1040" y="345">graph:coverage</text>
  <rect class="box orange" x="900" y="530" width="280" height="90" rx="8"/><text class="text" x="1040" y="575">graph:duplicates</text>

  <rect class="box purple" x="1260" y="390" width="260" height="120" rx="8"/><text class="text" x="1390" y="432">graphs/index.html</text><text class="small" x="1390" y="466">interactive map</text>

  <rect class="box green" x="1210" y="650" width="155" height="70" rx="8"/><text class="small" x="1288" y="685">possible tests</text>
  <rect class="box red" x="1385" y="650" width="145" height="70" rx="8"/><text class="small" x="1458" y="685">coverage gaps</text>
  <rect class="box orange" x="1290" y="750" width="170" height="70" rx="8"/><text class="small" x="1375" y="785">duplicate risks</text>

  <path class="edge" d="M395 262H515"/><path class="edge" d="M395 447H515"/><path class="edge" d="M395 632C450 632 455 490 515 490"/>
  <path class="edge" d="M795 255C850 255 850 345 890 345"/><path class="edge" d="M795 490C850 490 850 345 890 345"/><path class="edge" d="M795 490C850 490 850 575 890 575"/>
  <path class="edge" d="M1180 345C1225 345 1225 450 1250 450"/><path class="edge" d="M1180 575C1230 575 1230 485 1250 485"/>
  <path class="edge" d="M1390 510V640"/><path class="edge" d="M1390 510C1320 570 1290 600 1288 640"/><path class="edge" d="M1390 510C1455 575 1460 600 1458 640"/>
</svg>
