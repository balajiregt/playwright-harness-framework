<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mode 2 Without MCP Using CLI Agents And Playwright CLI Evidence</title>
  <desc id="desc">Architecture diagram showing a no MCP Playwright automation flow using prompts, local harness context, playwright-cli captures, curated YAML evidence, flow specs, framework layers, npx Playwright verification, artifacts and CI review gates.</desc>
  <defs>
    <pattern id="dot-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="4.5" fill="#1f2937" opacity="0.72"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#d6d9df"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill: #020817; }
      .title { fill: #f8fafc; font: 700 44px Inter, Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #b6c2d1; font: 400 22px Inter, Arial, sans-serif; }
      .box { fill: #20242b; stroke: #d6d9df; stroke-width: 3; filter: url(#soft-shadow); }
      .box-blue { fill: #0f83bd; stroke: #cdeafe; stroke-width: 3; filter: url(#soft-shadow); }
      .box-green { fill: #0f766e; stroke: #ccfbf1; stroke-width: 3; filter: url(#soft-shadow); }
      .box-purple { fill: #5b3fb3; stroke: #ddd6fe; stroke-width: 3; filter: url(#soft-shadow); }
      .box-red { fill: #991b1b; stroke: #fecaca; stroke-width: 3; filter: url(#soft-shadow); }
      .box-orange { fill: #9a5412; stroke: #fed7aa; stroke-width: 3; filter: url(#soft-shadow); }
      .dash { fill: none; stroke: #d6d9df; stroke-width: 4; stroke-dasharray: 18 16; }
      .label { fill: #f8fafc; font: 700 25px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .small { fill: #e5e7eb; font: 600 19px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .tiny { fill: #d1d5db; font: 500 17px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .edge { stroke: #d6d9df; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .edge-soft { stroke: #8fb9cf; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .chip { fill: #4b5563; stroke: #9ca3af; stroke-width: 2; }
      .chip-text { fill: #f3f4f6; font: 700 17px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <rect width="1600" height="1000" fill="url(#dot-grid)" opacity="0.75"/>

  <text class="title" x="800" y="70" text-anchor="middle">Mode 2: No MCP, CLI Evidence Loop</text>
  <text class="subtitle" x="800" y="108" text-anchor="middle">Prompt based generation using local captures, Playwright CLI, and test-runner artifacts</text>

  <rect class="dash" x="70" y="150" width="1460" height="770" rx="18"/>
  <text class="tiny" x="190" y="150">MCP-blocked enterprise path</text>

  <rect class="box" x="620" y="165" width="360" height="95" rx="8"/>
  <text class="label" x="800" y="212">Prompt / Flow Request</text>

  <rect class="box-green" x="120" y="300" width="340" height="160" rx="8"/>
  <text class="label" x="290" y="338">Local Harness Context</text>
  <text class="tiny" x="290" y="380">AGENTS.md, Copilot rules</text>
  <text class="tiny" x="290" y="410">command map, graph rules</text>

  <rect class="box-blue" x="565" y="305" width="470" height="195" rx="8"/>
  <text class="label" x="800" y="342">playwright-cli Capture Loop</text>
  <rect class="chip" x="605" y="382" width="95" height="46" rx="6"/>
  <text class="chip-text" x="652" y="405">open</text>
  <rect class="chip" x="715" y="382" width="120" height="46" rx="6"/>
  <text class="chip-text" x="775" y="405">snapshot</text>
  <rect class="chip" x="850" y="382" width="125" height="46" rx="6"/>
  <text class="chip-text" x="912" y="405">screenshot</text>
  <text class="tiny" x="800" y="468">state-save, localStorage, page refs</text>

  <rect class="box-purple" x="1145" y="300" width="335" height="160" rx="8"/>
  <text class="label" x="1312" y="338">Curated Captures</text>
  <text class="tiny" x="1312" y="380">contexts/captures/*.yml</text>
  <text class="tiny" x="1312" y="410">screenshots when useful</text>

  <rect class="box" x="145" y="600" width="260" height="110" rx="8"/>
  <text class="label" x="275" y="640">Flow Spec</text>
  <text class="small" x="275" y="675">specs/*.md</text>

  <rect class="box-green" x="515" y="575" width="360" height="165" rx="8"/>
  <text class="label" x="695" y="615">Framework Layers</text>
  <text class="tiny" x="695" y="655">fixtures, pages</text>
  <text class="tiny" x="695" y="685">assertions, data</text>
  <text class="tiny" x="695" y="715">tests/*.spec.ts</text>

  <rect class="box-blue" x="990" y="590" width="300" height="120" rx="8"/>
  <text class="label" x="1140" y="632">npx playwright test</text>
  <text class="small" x="1140" y="670">focused CLI verification</text>

  <rect class="box-orange" x="1125" y="790" width="300" height="110" rx="8"/>
  <text class="label" x="1275" y="830">Evidence</text>
  <text class="small" x="1275" y="865">trace, report, logs</text>

  <rect class="box-red" x="720" y="805" width="260" height="95" rx="8"/>
  <text class="label" x="850" y="852">Healer Loop</text>

  <rect class="box-green" x="300" y="805" width="285" height="95" rx="8"/>
  <text class="label" x="442" y="852">Review Gates + CI</text>

  <path class="edge" d="M 800 260 L 800 295"/>
  <path class="edge" d="M 460 380 L 555 380"/>
  <path class="edge" d="M 1035 380 L 1135 380"/>
  <path class="edge-soft" d="M 1312 460 C 1312 535 275 520 275 590"/>
  <path class="edge" d="M 405 655 L 505 655"/>
  <path class="edge" d="M 875 655 L 980 650"/>
  <path class="edge" d="M 1140 710 L 1240 780"/>
  <path class="edge" d="M 1125 845 L 990 852"/>
  <path class="edge" d="M 720 852 L 595 852"/>
  <path class="edge-soft" d="M 850 805 C 785 760 755 755 720 742"/>
  <path class="edge" d="M 442 805 C 430 770 600 755 625 742"/>
</svg>
