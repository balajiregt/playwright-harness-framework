<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Team Adoption Flow For The Agentic Playwright Harness</title>
  <desc id="desc">Flow diagram showing how teams adopt the harness through instructions, framework layers, Playwright CLI captures, source-aware graph intelligence, and CI commands.</desc>
  <defs>
    <pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="4" fill="#1f2937" opacity="0.75"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 11 6 1 11z" fill="#d6d9df"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/></filter>
    <style>
      .bg{fill:#020817}.title{fill:#f8fafc;font:700 44px Inter,Arial,sans-serif}.sub{fill:#b6c2d1;font:400 22px Inter,Arial,sans-serif}.box{stroke:#d6d9df;stroke-width:3;filter:url(#shadow)}.green{fill:#0f766e}.blue{fill:#0f83bd}.purple{fill:#5b3fb3}.orange{fill:#9a5412}.dark{fill:#20242b}.text{fill:#f8fafc;font:700 23px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#e5e7eb;font:500 17px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.edge{stroke:#d6d9df;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="900" fill="url(#dots)" opacity="0.8"/>
  <text class="title" x="800" y="64" text-anchor="middle">How Teams Incorporate The Harness</text>
  <text class="sub" x="800" y="103" text-anchor="middle">Adopt standards first, then add captures, graph intelligence, and CI gates</text>

  <rect class="box green" x="90" y="310" width="250" height="145" rx="8"/><text class="text" x="215" y="350">Phase 1</text><text class="small" x="215" y="390">Add agent</text><text class="small" x="215" y="418">instructions</text>
  <rect class="box blue" x="390" y="310" width="250" height="145" rx="8"/><text class="text" x="515" y="350">Phase 2</text><text class="small" x="515" y="390">Standardize</text><text class="small" x="515" y="418">framework layers</text>
  <rect class="box purple" x="690" y="310" width="250" height="145" rx="8"/><text class="text" x="815" y="350">Phase 3</text><text class="small" x="815" y="390">Capture page</text><text class="small" x="815" y="418">context with CLI</text>
  <rect class="box orange" x="990" y="310" width="250" height="145" rx="8"/><text class="text" x="1115" y="350">Phase 4</text><text class="small" x="1115" y="390">Add source-aware</text><text class="small" x="1115" y="418">graph review</text>
  <rect class="box green" x="1290" y="310" width="250" height="145" rx="8"/><text class="text" x="1415" y="350">Phase 5</text><text class="small" x="1415" y="390">Run same gates</text><text class="small" x="1415" y="418">in CI</text>

  <path class="edge" d="M340 382H380"/><path class="edge" d="M640 382H680"/><path class="edge" d="M940 382H980"/><path class="edge" d="M1240 382H1280"/>

  <rect class="box dark" x="245" y="620" width="320" height="115" rx="8"/><text class="text" x="405" y="660">Copilot Prompt</text><text class="small" x="405" y="692">simple flow request</text>
  <rect class="box blue" x="650" y="620" width="320" height="115" rx="8"/><text class="text" x="810" y="660">Harness Loop</text><text class="small" x="810" y="692">observe, plan, act, verify</text>
  <rect class="box green" x="1055" y="620" width="320" height="115" rx="8"/><text class="text" x="1215" y="660">Team Output</text><text class="small" x="1215" y="692">reviewable automation</text>

  <path class="edge" d="M565 678H640"/><path class="edge" d="M970 678H1045"/><path class="edge" d="M815 455V610"/>
</svg>
