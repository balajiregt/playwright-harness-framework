<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Problem Solved By The Agentic Playwright Harness</title>
  <desc id="desc">Decision flow contrasting ungoverned AI generated tests with harness governed Playwright tests.</desc>
  <defs>
    <pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="4" fill="#1f2937" opacity="0.75"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 11 6 1 11z" fill="#d6d9df"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/></filter>
    <style>
      .bg{fill:#020817}.title{fill:#f8fafc;font:700 44px Inter,Arial,sans-serif}.sub{fill:#b6c2d1;font:400 22px Inter,Arial,sans-serif}.box{stroke:#d6d9df;stroke-width:3;filter:url(#shadow)}.dark{fill:#20242b}.green{fill:#0f766e}.red{fill:#991b1b}.blue{fill:#0f83bd}.text{fill:#f8fafc;font:700 25px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#e5e7eb;font:500 18px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.edge{stroke:#d6d9df;stroke-width:4;fill:none;marker-end:url(#arrow)}.tag{fill:#4b5563;stroke:#9ca3af;stroke-width:2}.tagText{fill:#f3f4f6;font:700 17px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="900" fill="url(#dots)" opacity="0.8"/>
  <text class="title" x="800" y="64" text-anchor="middle">Why We Need A Harness</text>
  <text class="sub" x="800" y="103" text-anchor="middle">AI generation is easy; consistent governance is the hard part</text>

  <rect class="box blue" x="565" y="170" width="470" height="110" rx="8"/><text class="text" x="800" y="225">AI can generate Playwright tests</text>
  <path class="edge" d="M800 280V355"/>
  <path class="box dark" d="M800 355L1000 500L800 645L600 500Z"/>
  <text class="text" x="800" y="482">Will every test</text><text class="text" x="800" y="520">follow team standards?</text>

  <path class="edge" d="M600 500C465 500 430 365 315 365"/>
  <path class="edge" d="M1000 500C1135 500 1170 365 1285 365"/>
  <rect class="box red" x="90" y="310" width="360" height="210" rx="8"/>
  <text class="text" x="270" y="350">Without Harness</text>
  <text class="small" x="270" y="395">duplicate flows</text><text class="small" x="270" y="425">random selectors</text><text class="small" x="270" y="455">fixed waits</text><text class="small" x="270" y="485">weak evidence</text>
  <rect class="box green" x="1150" y="310" width="360" height="210" rx="8"/>
  <text class="text" x="1330" y="350">With Harness</text>
  <text class="small" x="1330" y="395">layered framework</text><text class="small" x="1330" y="425">stable locators</text><text class="small" x="1330" y="455">CLI verification</text><text class="small" x="1330" y="485">review gates</text>

  <path class="edge" d="M270 520V660"/><path class="edge" d="M1330 520V660"/>
  <rect class="box red" x="95" y="660" width="350" height="90" rx="8"/><text class="text" x="270" y="705">Faster Drift</text>
  <rect class="box green" x="1145" y="660" width="370" height="90" rx="8"/><text class="text" x="1330" y="705">Reviewable Automation</text>
</svg>
