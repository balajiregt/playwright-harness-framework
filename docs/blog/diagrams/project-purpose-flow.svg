<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Playwright Harness Project Flow</title>
  <desc id="desc">Flow diagram showing how a prompt becomes a governed Playwright test using harness instructions, context graphs, flow specs, framework layers, CLI verification, evidence review, captures, and source-aware graph intelligence.</desc>
  <defs>
    <pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="4" fill="#1f2937" opacity="0.75"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 11 6 1 11z" fill="#d6d9df"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/></filter>
    <style>
      .bg{fill:#020817}.title{fill:#f8fafc;font:700 44px Inter,Arial,sans-serif}.sub{fill:#b6c2d1;font:400 22px Inter,Arial,sans-serif}.box{stroke:#d6d9df;stroke-width:3;filter:url(#shadow)}.dark{fill:#20242b}.green{fill:#0f766e}.blue{fill:#0f83bd}.purple{fill:#5b3fb3}.orange{fill:#9a5412}.red{fill:#991b1b}.text{fill:#f8fafc;font:700 24px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#e5e7eb;font:500 17px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.edge{stroke:#d6d9df;stroke-width:4;fill:none;marker-end:url(#arrow)}.soft{stroke:#8fb9cf;stroke-width:4;fill:none;marker-end:url(#arrow);stroke-dasharray:10 10}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="900" fill="url(#dots)" opacity="0.8"/>
  <text class="title" x="800" y="64" text-anchor="middle">What The Harness Does</text>
  <text class="sub" x="800" y="103" text-anchor="middle">Turns simple prompts into stable, reviewable, team-standard Playwright tests</text>

  <rect class="box dark" x="85" y="210" width="210" height="100" rx="8"/><text class="text" x="190" y="260">Prompt</text>
  <rect class="box green" x="365" y="210" width="250" height="100" rx="8"/><text class="text" x="490" y="250">Harness</text><text class="small" x="490" y="282">rules + instructions</text>
  <rect class="box blue" x="690" y="210" width="250" height="100" rx="8"/><text class="text" x="815" y="250">Context Graph</text><text class="small" x="815" y="282">contexts/*.yml</text>
  <rect class="box purple" x="1015" y="210" width="230" height="100" rx="8"/><text class="text" x="1130" y="260">Flow Spec</text>
  <rect class="box green" x="1310" y="210" width="230" height="100" rx="8"/><text class="text" x="1425" y="250">Framework</text><text class="small" x="1425" y="282">layers</text>

  <rect class="box dark" x="360" y="570" width="240" height="100" rx="8"/><text class="text" x="480" y="610">Playwright</text><text class="small" x="480" y="642">test</text>
  <rect class="box blue" x="690" y="570" width="250" height="100" rx="8"/><text class="text" x="815" y="610">CLI</text><text class="small" x="815" y="642">verification</text>
  <rect class="box orange" x="1030" y="570" width="250" height="100" rx="8"/><text class="text" x="1155" y="610">Evidence</text><text class="small" x="1155" y="642">review</text>
  <rect class="box green" x="1325" y="570" width="230" height="100" rx="8"/><text class="text" x="1440" y="610">Stable</text><text class="small" x="1440" y="642">team test</text>

  <rect class="box blue" x="650" y="390" width="210" height="80" rx="8"/><text class="small" x="755" y="418">playwright-cli</text><text class="small" x="755" y="445">captures</text>
  <rect class="box red" x="955" y="390" width="220" height="80" rx="8"/><text class="small" x="1065" y="418">source-aware</text><text class="small" x="1065" y="445">gaps + duplicates</text>

  <path class="edge" d="M295 260H355"/><path class="edge" d="M615 260H680"/><path class="edge" d="M940 260H1005"/><path class="edge" d="M1245 260H1300"/>
  <path class="edge" d="M1425 310C1425 480 480 430 480 560"/><path class="edge" d="M600 620H680"/><path class="edge" d="M940 620H1020"/><path class="edge" d="M1280 620H1315"/>
  <path class="soft" d="M815 310V380"/><path class="soft" d="M940 430H945"/><path class="soft" d="M1065 470C1065 535 815 510 815 560"/>
</svg>
